services:

  web:
    build: .
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - DATABASE_URL=postgresql://root:root@db:5432/coctel_db
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: coctel_db
    ports:
      - 5432:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - db
